[package]
name = "rover"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An MCP server for fetching and prepping web content for LLM agents."
repository = "https://github.com/aaronbassett/rover"
readme = "README.md"
rust-version = "1.85"

[lib]
name = "rover"
path = "src/lib.rs"

[[bin]]
name = "rover"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "charset"] }
url = "2"
encoding_rs = "0.8"
chardetng = "1"
scraper = "0.26"
clap = { version = "4", features = ["derive"] }
dirs = "5"
toml = "1"
sha2 = "0.11"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
readabilityrs = "0.1"
regex = "1"
rusqlite = "0.37"
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
humantime-serde = "1"
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
csv = "1"
rand = "0.9"
rand_chacha = "0.9"
mime_guess = "2"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "test-util"] }
rmcp = { version = "1", features = ["client", "transport-child-process"] }

[features]
default = []
test-loopback = []

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
