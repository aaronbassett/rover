[package]
# `rover` is taken on crates.io by an unrelated Cosmos project, so the crate
# is published as `rover-fetch`. The installed binary is still `rover` (see the
# `[[bin]]` section) and the library is still imported as `rover` (`[lib]`),
# so only the crates.io package name differs.
name = "rover-fetch"
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An MCP server for fetching and prepping web content for LLM agents."
repository = "https://github.com/aaronbassett/rover"
homepage = "https://github.com/aaronbassett/rover"
readme = "README.md"
keywords = ["mcp", "web", "scraping", "markdown", "llm"]
categories = ["command-line-utilities", "web-programming"]
# The docs site (site/) and local planning artifacts are never part of the crate.
exclude = ["/site", "/.superpowers", "/docs"]
rust-version = "1.96.0"

[lib]
name = "rover"
path = "src/lib.rs"

[[bin]]
name = "rover"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
encoding_rs = "0.8"
chardetng = "1"
scraper = "0.26"
clap = { version = "4", features = ["derive"] }
dirs = "5"
toml = "1"
toml_edit = "0.22"
sha2 = "0.11"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
readabilityrs = "0.1"
regex = "1"
aho-corasick = "1"
fancy-regex = "0.13"
rusqlite = { version = "0.37", features = ["hooks"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "std"] }
humantime-serde = "1"
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
csv = "1"
rand = "0.9"
rand_chacha = "0.9"
mime_guess = "2"
governor = "0.10"
har = "0.9"
robotxt = { version = "0.6", default-features = false, features = ["parser"] }
httpdate = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
genai = "0.4"
zstd = { version = "0.13", default-features = false }
futures = "0.3"
base64 = "0.22"
chromiumoxide = { version = "0.9.1", optional = true, default-features = false }
tempfile = { version = "3", optional = true }
mistralrs = { version = "0.8.1", optional = true, default-features = false }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
mistralrs = { version = "0.8.1", optional = true, default-features = false, features = ["metal"] }

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "test-util"] }
rmcp = { version = "1", features = ["client", "transport-child-process"] }

[features]
default = []
test-loopback = []
headless = ["dep:chromiumoxide", "dep:tempfile"]
local-inference = ["dep:mistralrs"]
injection-model = ["dep:ort"]

[profile.release]
# Strip symbols at link time so release artefacts (and the prebuilt release
# tarballs) ship lean without a platform-specific `strip` step in CI — this
# matters most for the cross-compiled aarch64-linux build where the host
# `strip` cannot operate on the foreign ELF.
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "aaronbassett/homebrew-tap"
# Customize the Homebrew formula name
formula = "rover"
# CI backends to support
ci = "github"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[package.metadata.dist]
features = ["headless"]
default-features = false

# No Homebrew browser dependency. `chromium` is a (deprecated) Homebrew *cask*,
# not a formula, so `depends_on "chromium"` fails with "No available formula".
# Forcing a browser onto every CLI install is also wrong: headless rendering is
# opt-in, and Rover auto-detects a Chrome/Chromium install at runtime (verified
# by `rover doctor`). Headless users install a browser themselves, e.g.
# `brew install --cask chromium`.
