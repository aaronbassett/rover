[package]
# `rover` is taken on crates.io by an unrelated Cosmos project, so the crate
# is published as `rover-mcp`. The installed binary is still `rover` (see the
# `[[bin]]` section) and the library is still imported as `rover` (`[lib]`),
# so only the crates.io package name differs.
name = "rover-mcp"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An MCP server for fetching and prepping web content for LLM agents."
repository = "https://github.com/aaronbassett/rover"
readme = "README.md"
keywords = ["mcp", "web", "scraping", "markdown", "llm"]
categories = ["command-line-utilities", "web-programming"]
rust-version = "1.85"

[lib]
name = "rover"
path = "src/lib.rs"

[[bin]]
name = "rover"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
encoding_rs = "0.8"
chardetng = "1"
scraper = "0.26"
clap = { version = "4", features = ["derive"] }
dirs = "5"
toml = "1"
toml_edit = "0.22"
sha2 = "0.11"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
readabilityrs = "0.1"
regex = "1"
rusqlite = { version = "0.37", features = ["hooks"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "std"] }
humantime-serde = "1"
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
csv = "1"
rand = "0.9"
rand_chacha = "0.9"
mime_guess = "2"
governor = "0.10"
har = "0.9"
robotxt = { version = "0.6", default-features = false, features = ["parser"] }
httpdate = "1"
unicode-segmentation = "1"
genai = "0.4"
zstd = { version = "0.13", default-features = false }
futures = "0.3"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
chromiumoxide = { version = "0.9.1", optional = true, default-features = false }
mistralrs = { version = "0.8.1", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
mistralrs = { version = "0.8.1", optional = true, default-features = false, features = ["metal"] }

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "test-util"] }
rmcp = { version = "1", features = ["client", "transport-child-process"] }

[features]
default = []
test-loopback = []
headless = ["dep:chromiumoxide"]
local-vision = ["dep:mistralrs", "dep:image"]
local-inference = ["dep:mistralrs"]

[profile.release]
# Strip symbols at link time so release artefacts (and the prebuilt release
# tarballs) ship lean without a platform-specific `strip` step in CI — this
# matters most for the cross-compiled aarch64-linux build where the host
# `strip` cannot operate on the foreign ELF.
strip = "symbols"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
