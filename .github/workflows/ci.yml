name: CI

on:
  pull_request:
    paths-ignore: ['site/**']
  push:
    branches: [main]
    paths-ignore: ['site/**']

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `[lints.rust] warnings = "deny"` in Cargo.toml already turns rustc warnings
  # into hard errors. We pass `-D warnings` to clippy explicitly so clippy
  # warnings also fail the build.
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets --features test-loopback -- -D warnings
        run: cargo clippy --all-targets --features test-loopback -- -D warnings

      - name: cargo test --lib --features test-loopback
        run: cargo test --lib --features test-loopback

      # Fast subset of the integration suite. Curated by exclusion:
      # anything that spawns a subprocess (CLI smoke tests via
      # `assert_cmd`), sleeps on a real timer (HAR flush waits,
      # cooperative-cancellation timing, server lifecycle), or starts
      # `rover mcp` end-to-end stays in the nightly `smoketest.yml`.
      # Wiremock-only tests are included — they run in-process and are
      # fast. The set covers SSRF policy + dial-time enforcement, the
      # fetcher end-to-end loop, robots / rate-limit / retry classifier,
      # the MCP tool surface (excluding the lifecycle tests), the
      # extractor pipeline, summarizer backends, and cache + revalidate
      # plumbing. Keep the list explicit (vs. e.g. globbing on test
      # filename) so every addition is a deliberate review-the-runtime
      # decision.
      - name: cargo test (fast integration subset)
        run: |
          cargo test --features test-loopback \
            --test cli_batch_snapshot \
            --test cli_config \
            --test cross_process_notify \
            --test extractor_images \
            --test extractor_images_ssrf \
            --test extractor_links \
            --test extractor_metadata \
            --test extractor_tables \
            --test fetch_max_tokens_auto_summarize \
            --test fetch_summarize_arg \
            --test fetcher_full_loop \
            --test fetcher_integration \
            --test fetcher_rate_limit \
            --test fetcher_retry \
            --test fetcher_robots \
            --test fetcher_ssrf_dial_pinning \
            --test images_caption_filters \
            --test mcp_batch_fetch \
            --test mcp_count_tokens_estimates \
            --test mcp_fetch_caption_override \
            --test mcp_get_metadata \
            --test mcp_http_allow_server_paths \
            --test mcp_http_auth \
            --test mcp_http_transport \
            --test mcp_stdio_path_modes \
            --test mcp_summarize \
            --test meta_hook \
            --test meta_use \
            --test redact_logs \
            --test ssrf_project_file \
            --test summarizer_cloud \
            --test summarizer_extractive \
            --test summary_cache_lifecycle \
            --test tables_summarize_mode \
            --test tasks_retry_deferred \
            --test tasks_revalidate \
            --test tokenizer_integration \
            --test vlm_cloud_smoke

      # The remaining integration files (sleep-bound or subprocess-bound
      # cli/* tests, cache_lifecycle, har_output, mcp_smoke,
      # servers_lifecycle, tables_summarize_parallel, tasks_cancellation,
      # tasks_lifecycle, plus the `#[ignore]`'d feature-gated smokes)
      # still run nightly via `smoketest.yml`.

      - name: cargo build --release
        run: cargo build --release

  msrv:
    name: MSRV (1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      # `cargo check`, not `cargo test`: the MSRV contract is "the code
      # compiles on 1.96.0", not "the environment-dependent tests pass".
      - run: cargo check --all-targets --features test-loopback

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: chrome.json diverges from upstream by exactly {clone, setns, unshare}
        # chrome.json (repo root) is a seccomp profile hand-derived from
        # Docker's maintained default (github.com/moby/profiles,
        # seccomp/default.json) by two edits: clone's namespace-flag mask
        # removed, and unshare/setns pulled out of the CAP_SYS_ADMIN gate.
        # A name-count comparison is blind to argument-level rules — that's
        # exactly how a prior round of this file silently widened `socket`.
        # This expands both profiles to (name, action, errnoRet, args,
        # includes, excludes) tuples per syscall name and asserts the
        # symmetric difference touches only {clone, setns, unshare}.
        #
        # raw.githubusercontent.com is an external dependency outside this
        # repo's control. Retried a few times, then downgraded to a
        # non-blocking warning rather than failing the whole job on a
        # transient network blip unrelated to this change — a real drift
        # regression still fails loudly once the fetch succeeds.
        run: |
          set -euo pipefail
          upstream_url='https://raw.githubusercontent.com/moby/profiles/main/seccomp/default.json'
          if ! curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
              -o /tmp/upstream-seccomp.json "$upstream_url"; then
            echo "::warning::could not reach $upstream_url after retries — skipping the chrome.json drift check for this run"
            exit 0
          fi
          python3 - <<'PY'
          import json
          import sys

          EXPECTED = {"clone", "setns", "unshare"}

          def load(path):
              with open(path) as f:
                  return json.load(f)

          def explode(profile):
              tuples = set()
              for entry in profile["syscalls"]:
                  action = entry.get("action")
                  errno_ret = entry.get("errnoRet")
                  args = json.dumps(entry.get("args", []), sort_keys=True)
                  includes = json.dumps(entry.get("includes", {}), sort_keys=True)
                  excludes = json.dumps(entry.get("excludes", {}), sort_keys=True)
                  for name in entry["names"]:
                      tuples.add((name, action, errno_ret, args, includes, excludes))
              return tuples

          local = load("chrome.json")
          upstream = load("/tmp/upstream-seccomp.json")

          # The two documented edits are scoped to individual syscall rules;
          # a profile-wide default action/errno swap (e.g. ERRNO -> ALLOW)
          # would not show up in the per-name tuple diff below at all.
          if (local.get("defaultAction"), local.get("defaultErrnoRet")) != (
              upstream.get("defaultAction"),
              upstream.get("defaultErrnoRet"),
          ):
              print("::error::chrome.json's defaultAction/defaultErrnoRet diverge from upstream — the two documented edits never touch these")
              sys.exit(1)

          diff = explode(local) ^ explode(upstream)
          changed = {t[0] for t in diff}

          if changed != EXPECTED:
              print(f"::error::chrome.json diverges from upstream by {sorted(changed)}, expected exactly {sorted(EXPECTED)}")
              for t in sorted(diff):
                  print(f"  {t}")
              sys.exit(1)

          print(f"chrome.json diverges from upstream by exactly {sorted(EXPECTED)} — OK")
          PY

      - name: Build the server image
        run: docker build -t rover:ci .
      - name: Smoke-test the health probes
        run: |
          docker run --rm -d --name rover-ci -p 7683:7683 \
            -e ROVER_HTTP_TOKEN=ci-token-with-enough-entropy rover:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:7683/healthz; then break; fi
            sleep 2
          done
          curl -fsS localhost:7683/healthz
          curl -fsS localhost:7683/readyz
      - name: Smoke-test /mcp requires the configured token
        # Guards against exactly the gap `tests/mcp_http_parity.rs`'s
        # `spawned_server_enforces_the_configured_token` covers for a
        # subprocess-spawned binary: this job builds and runs the actual
        # container image with ROVER_HTTP_TOKEN set, but previously only
        # ever probed the deliberately-unauthenticated /healthz and
        # /readyz — so a real container shipping with auth broken wide
        # open would have passed this job identically.
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST localhost:7683/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}')
          echo "status: $status"
          if [ "$status" != "401" ]; then
            echo "::error::expected 401 for /mcp with no Authorization header against a container built with ROVER_HTTP_TOKEN set, got $status"
            exit 1
          fi
      - name: Stop the container
        if: always()
        run: docker rm -f rover-ci

      - name: Build the headless image
        run: docker build --target runtime-headless -t rover:ci-headless .

      # Rover itself under the profile. Without this the gate is asymmetric:
      # the raw-Chromium probe below bypasses Rover via `--entrypoint`, and
      # the negative probe asserts Rover *refuses*, so "Rover can never
      # launch, on any input" satisfies both. Rover's Chrome is not the
      # probe's — `--headless=new`, CDP request interception, an explicit
      # `user_data_dir`, and real page loads spawning renderer/GPU/utility
      # processes are all syscall surface `--dump-dom about:blank` never
      # touches.
      - name: Headless image renders WITH the profile
        run: |
          set -euo pipefail
          out=$(docker run --rm --security-opt seccomp=./chrome.json --shm-size=1g \
            rover:ci-headless doctor 2>&1); echo "$out"
          echo "$out" | grep -qi "browser launched"

      # Kept alongside the Rover run: it isolates Chromium from Rover, so
      # when the pair disagrees you know which side broke.
      - name: Headless image renders with the sandbox enabled
        run: |
          set -euo pipefail
          docker run --rm --security-opt seccomp=./chrome.json --shm-size=1g \
            --entrypoint /usr/bin/chromium rover:ci-headless \
            --headless=new --dump-dom about:blank | tee /tmp/dom.txt
          grep -q '<html>' /tmp/dom.txt

      # The probe that carries the weight. A render-succeeds check passes
      # whether or not the sandbox is on, so it would stay green if someone
      # "fixed" a launch failure by adding --no-sandbox. This one goes red in
      # exactly that case: with no seccomp profile the sandbox cannot start,
      # and Rover must refuse rather than render.
      - name: Headless image refuses to run unsandboxed
        run: |
          set +e
          out=$(docker run --rm rover:ci-headless doctor 2>&1)
          set -e
          echo "$out"
          if echo "$out" | grep -qi "browser launched"; then
            echo "::error::browser launched with no seccomp profile — the sandbox is disabled"
            exit 1
          fi
          if ! echo "$out" | grep -q "chrome.json"; then
            echo "::error::doctor did not surface the sandbox remediation"
            exit 1
          fi
