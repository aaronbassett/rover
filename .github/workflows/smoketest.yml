name: Smoketest

# Nightly run of the full integration suite — the wiremock-backed,
# subprocess-spawning, sleep-bound tests under `tests/*.rs` that are
# deliberately kept off the PR/push blocking path (see `ci.yml` and
# `lefthook.yml`).
#
# Runs daily at 04:00 UTC; also exposes `workflow_dispatch` so it can be
# triggered manually from the Actions tab when investigating a regression.

on:
  schedule:
    # 04:00 UTC every day.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  smoketest:
    name: smoketest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Full integration suite. Includes everything `ci.yml` skips:
      # wiremock-backed HTTP fetch tests, CLI subprocess tests
      # (`tests/cli_*.rs`), HAR flush waits, multi-connection notify
      # timing tests, and the long task-scheduler lifecycle suites.
      - name: cargo test --features test-loopback
        run: cargo test --features test-loopback

  feature-local-inference:
    name: feature local-inference (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-local-inference-${{ runner.os }}-smollm2-135m
      # Model-integrity tests use synthetic caches and do not download a model.
      - run: cargo test --features local-inference,test-loopback --lib model_integrity
      - run: cargo test --features local-inference,test-loopback --test model_integrity
      - run: cargo test --features local-inference,test-loopback --test local_inference_smoke -- --ignored
        env:
          # CI uses a tiny model to keep run time bounded.
          ROVER_CI_TEST_MODEL: HuggingFaceTB/SmolLM2-135M-Instruct

  feature-local-vision:
    name: feature local-vision (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-local-vision-${{ runner.os }}-smolvlm-256m
      - run: cargo test --features local-vision,test-loopback --test vlm_local_smoke -- --ignored

  feature-headless:
    name: feature headless (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser
      - run: cargo test --features headless,test-loopback --test headless_smoke -- --ignored
      - run: cargo test --features headless,test-loopback --test headless_ssrf_intercept -- --ignored

  binary-size:
    name: Binary size (default features < 75 MiB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --no-default-features
      - name: Assert size
        run: |
          size_bytes=$(stat -c%s target/release/rover)
          limit=$((75 * 1024 * 1024))
          echo "binary size: $size_bytes bytes (limit: $limit)"
          if [ "$size_bytes" -ge "$limit" ]; then
            echo "::error::binary size $size_bytes >= 75 MiB limit"
            exit 1
          fi
