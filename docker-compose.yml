# Rover on an internal network. No host port is published: agent containers
# reach it at http://rover:7683/mcp and nothing binds on the host.
services:
  rover:
    build: .
    environment:
      # Fails the whole `up` if unset, rather than starting an open instance.
      ROVER_HTTP_TOKEN: "${ROVER_HTTP_TOKEN:?set ROVER_HTTP_TOKEN in .env — generate with: openssl rand -hex 32}"
      ROVER_CONFIG: /config/rover.toml
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RUST_LOG: info
    volumes:
      - rover-data:/data
      - ./rover.toml:/config/rover.toml:ro
    networks: [agents]
    # Bounded, not the Docker default (unbounded json-file): an
    # unauthenticated caller on this network can drive hundreds of rejected
    # requests/sec against /mcp (no rate limiting on failed auth — see
    # src/mcp/http.rs's RejectionThrottle for the per-process half of this
    # mitigation), and without a cap that fills the host disk before anyone
    # holds a valid token.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  rover-data:

networks:
  agents:
